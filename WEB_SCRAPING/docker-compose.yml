version: '3.8'

services:
  # ChromaDB Vector Database Service
  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb-promit
    ports:
      - "8000:8000"  # Map container port 8000 to host port 8000
    volumes:
      - chroma-data-promit-volume:/data  # Persist ChromaDB data
    environment:
      - IS_PERSISTENT=TRUE
    networks:
      - web-scraping-network

  # FastAPI Web Scraping Service
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi-web-scraping
    ports:
      - "8001:8000"  # Map container port 8000 to host port 8001
    environment:
      - CHROMA_DB_URL=http://chromadb:8000
    depends_on:
      - chromadb
    networks:
      - web-scraping-network
    restart: unless-stopped


volumes:
  chroma-data-promit-volume:
    driver: local

networks:
  web-scraping-network:
    driver: bridge

